# Publishes the site to GitHub Pages.
#
# Everything here is static — no build step — so the repository root is
# uploaded as-is. Paths in the pages are all relative, which is what lets
# the site work from a project subpath (…github.io/git/) rather than a
# domain root.

name: Deploy site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue them instead of cancelling, so the
# last push is always the one that ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        # Two things had to be set up by hand once, and neither can be
        # done from a workflow:
        #   1. Settings -> Pages -> Source: "GitHub Actions". Creating
        #      the Pages site is a permission GitHub withholds from the
        #      workflow token.
        #   2. This deploys from the default branch, because the
        #      github-pages environment only accepts the default branch
        #      unless its deployment-branch policy is widened.
        uses: actions/configure-pages@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/portfolio/package-lock.json

      # The repository root is a static site with no build step; the 3D
      # portfolio is a Vite app. Build it and stage its output into the root
      # under /portfolio, so one artifact carries both.
      - name: Build the portfolio
        working-directory: apps/portfolio
        run: |
          npm ci
          npm run build

      - name: Stage the portfolio
        run: |
          rm -rf portfolio
          mkdir -p portfolio
          cp -r apps/portfolio/dist/. portfolio/

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
